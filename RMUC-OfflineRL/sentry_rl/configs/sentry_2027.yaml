# Sentry RL workspace config (RMUC 2027 / Arena-1).
# Paths are resolved relative to this file's parent (sentry_rl/).

seed: 42
device: cpu
team: red
own_slot: "7"
# 2027 ground enemies: heavy(1), infantry(3,4), sentry(7). Slot 6 is the aerial system.
enemy_slots: ["1", "3", "4", "7"]

field:
  width: 28.0
  height: 15.0
  center_x: 14.0
  center_y: 7.5

decision:
  interval_s: 5.0
  engine_dt: 0.05
  steps_per_decision: 100
  max_decisions: 84          # 420 s / 5 s

lineup:
  "1": 2711
  "3": 2731
  "4": 2732
  "6": 2761
  "7": 2771

# Standard 28x15 field, centre origin, red side. Calibrate for the real 7v7 field.
goals:
  hold_outpost: [-3.02, 3.90]
  hold_base: [-7.43, 0.00]
  take_outpost: [3.02, -3.90]
  take_base: [7.43, 0.00]
  resupply: [-12.60, 5.50]
  retreat: [-12.60, 5.50]

arena:
  map: rmuc2027
  duration_s: 420
  python_path: "../Arena-1"       # add to sys.path before importing rmuc_arena
  sim_binary: ""                  # RMUC_SIM_BINARY, empty = Arena-1 default

radar:
  mode: synthetic                 # none | synthetic | oracle
  rate_hz: 5.0
  sigma_m: 0.7
  latency_s: 0.15
  dropout: 0.10
  timeout_s: 1.0

reward:
  control: 1.0
  structure: 0.001                 # per HP of enemy outpost/base damage
  damage_dealt: 0.01               # per HP
  damage_taken: 0.01               # per HP (subtracted)
  hit: 0.05                        # per 17mm hit (approx. damage/20)
  potential: 1.0                   # potential-based shaping
  win: 10.0
  lose: 10.0
  base_destroyed: 5.0

bc:
  epochs: 30
  batch_size: 256
  lr: 1.0e-3
  label_smoothing: 0.05
  class_weights: auto
  seed: 42

ppo:
  total_steps: 500000             # decisions, not engine steps
  n_envs: 16
  rollout_decisions: 84
  batch_size: 4096
  epochs: 4
  lr: 3.0e-4
  clip: 0.2
  entropy: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  gamma: 0.99                     # per 5 s step
  lam: 0.95
  bc_anchor: 0.0                  # optional KL to BC checkpoint

eval:
  seeds: 20
  swap_sides: true
  max_decisions: 84

paths:
  data: runs/data
  runs: runs
  checkpoints: checkpoints
